name: Rebuild chatbot index
on:
  push:
    paths: ['kb/**', 'sources/**', 'chatbot/build_index.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pypdf
      - run: python chatbot/build_index.py
      - run: |
          git config user.name "index-bot"
          git config user.email "index-bot@users.noreply.github.com"
          git add chatbot/index.json
          if ! git diff --cached --quiet; then git commit -m "Rebuild chatbot index" && git push; fi
